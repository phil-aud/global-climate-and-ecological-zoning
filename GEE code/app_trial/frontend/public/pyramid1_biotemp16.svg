  <!-- Computed coordinates: y = 862.13, x_left = 672.23, x_right = 1323.61 -->
  <g id="Overlay">
    <line id="biotemp16" class="overlay-line" x1="672.23" y1="862.13" x2="1323.61" y2="862.13" />
