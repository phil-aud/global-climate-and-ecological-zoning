<?xml version="1.0" encoding="UTF-8"?>
<svg id="Layer_1" xmlns="http://www.w3.org/2000/svg" version="1.1" viewBox="0 0 1626.06 1163.13">
  <!-- Derived from pyramid1.svg with an overlay for Mean Annual Biotemperature = 16°C -->
  <defs>
    <style>
      .overlay-line { stroke: #ff0000; stroke-width: 6; stroke-linecap: round; }
      .overlay-label { fill: #ff0000; font-size: 20px; font-family: Arial, sans-serif; font-weight:700; }
    </style>
  </defs>
  <!-- Triangle vertices: top=(997.92,298.13)  bottom-left=(603.77,980.81)  bottom-right=(1392.06,980.81) -->
